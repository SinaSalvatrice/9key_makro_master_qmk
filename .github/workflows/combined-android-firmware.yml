name: Combined Android + Firmware Build

on:
  workflow_dispatch:

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ninekey-configurator-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  firmware-reworked:
    name: Build Reworked Firmware UF2
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07
    permissions:
      contents: read

    env:
      KEYBOARD: 9key_makro_master_qmk
      KEYMAP: reworked
      QMK_HOME: /tmp/qmk_firmware

    steps:
      - name: Checkout keyboard repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Clone QMK Firmware
        run: |
          git clone --depth 1 --filter=blob:none https://github.com/qmk/qmk_firmware.git "$QMK_HOME"
          git -C "$QMK_HOME" submodule update --init --depth 1 lib/chibios lib/chibios-contrib lib/pico-sdk lib/printf lib/lufa
          qmk config user.qmk_home="$QMK_HOME"

      - name: Inject keyboard sources
        run: |
          mkdir -p "$QMK_HOME/keyboards/$KEYBOARD"
          find "$QMK_HOME/keyboards/$KEYBOARD" -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/." "$QMK_HOME/keyboards/$KEYBOARD/"
          rm -rf "$QMK_HOME/keyboards/$KEYBOARD/.git" "$QMK_HOME/keyboards/$KEYBOARD/.github"

      - name: Build firmware
        run: |
          git config --global --add safe.directory "$QMK_HOME"
          cd "$QMK_HOME"
          qmk compile -kb "$KEYBOARD" -km "$KEYMAP"

      - name: Stage artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$QMK_HOME" -type f -name "${KEYBOARD}_${KEYMAP}.uf2" -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          test -f "$GITHUB_WORKSPACE/artifacts/${KEYBOARD}_${KEYMAP}.uf2"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9key_makro_master_qmk_reworked_uf2
          path: artifacts/9key_makro_master_qmk_reworked.uf2
          if-no-files-found: error
          compression-level: 6
          overwrite: false
